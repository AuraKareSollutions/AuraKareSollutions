name: Deploy to MilesWeb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MILESWEB_HOST: 45.199.139.16
      MILESWEB_USER: aurakare1
      MILESWEB_PORT: 22
      MILESWEB_PATH: /var/www/ea00f2d8-b03b-4c96-b5c5-e96b0b58ee84/public_html

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JSON/package-lock.json

      - name: Build the production site from local repository files
        working-directory: JSON
        run: |
          npm ci
          npm run build

      - name: Generate protected PHP backend configuration
        env:
          MILESWEB_DB_HOST: ${{ secrets.MILESWEB_DB_HOST }}
          MILESWEB_DB_NAME: ${{ secrets.MILESWEB_DB_NAME }}
          MILESWEB_DB_USER: ${{ secrets.MILESWEB_DB_USER }}
          MILESWEB_DB_PASSWORD: ${{ secrets.MILESWEB_DB_PASSWORD }}
        run: |
          test -n "$MILESWEB_DB_NAME"
          test -n "$MILESWEB_DB_USER"
          test -n "$MILESWEB_DB_PASSWORD"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def php_string(value):
              return "'" + value.replace('\\', '\\\\').replace("'", "\\'") + "'"

          config = """<?php
          declare(strict_types=1);
          const DB_HOST = %s;
          const DB_NAME = %s;
          const DB_USER = %s;
          const DB_PASSWORD = %s;
          const MAIL_TO = 'hello@aurakaresollutions.com';
          const MAIL_FROM = 'noreply@aurakaresollutions.com';
          """ % (
              php_string(os.environ.get('MILESWEB_DB_HOST') or 'localhost'),
              php_string(os.environ['MILESWEB_DB_NAME']),
              php_string(os.environ['MILESWEB_DB_USER']),
              php_string(os.environ['MILESWEB_DB_PASSWORD']),
          )
          Path('JSON/dist/api/config.php').write_text(config)
          PY

      - name: Install SSH password helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Trust the MilesWeb SSH host
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "$MILESWEB_PORT" -H "$MILESWEB_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy generated files to MilesWeb
        env:
          SSHPASS: ${{ secrets.MILESWEB_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p "$MILESWEB_PORT" "$MILESWEB_USER@$MILESWEB_HOST" \
            "mkdir -p '$MILESWEB_PATH'"
          sshpass -e scp -P "$MILESWEB_PORT" -r JSON/dist/. \
            "$MILESWEB_USER@$MILESWEB_HOST:$MILESWEB_PATH/"

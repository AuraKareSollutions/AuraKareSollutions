<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1365 768" preserveAspectRatio="xMidYMid slice">
  <defs>
    <style>
      .cta-title-small { font-size: 74px; }
      .cta-title-large { font-size: 88px; }

      }
    </style>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050c16" stop-opacity=".94"/>
      <stop offset=".58" stop-color="#050c16" stop-opacity=".72"/>
      <stop offset="1" stop-color="#050c16" stop-opacity=".3"/>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7900"/>
      <stop offset="1" stop-color="#e85400"/>
    </linearGradient>
  </defs>
  <image x="0" y="0" width="1365" height="768" preserveAspectRatio="xMidYMid slice" xlink:href="template.jpg"/>
  <rect width="1365" height="768" fill="url(#cover)"/>
  <path d="M1010 0H1365V768H1120C1120 560 1175 420 1275 300C1325 240 1355 190 1365 120V0Z" fill="#29447f" opacity=".86"/>
